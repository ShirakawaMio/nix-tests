name: Build NixOS kexec ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check architecture
        run: |
          uname -m
          nix --version
          echo "$NIX_PATH"

      - name: Build kexec tarball
        run: |
          nix-build '<nixpkgs/nixos>' \
            -A config.system.build.kexec_tarball \
            -I nixos-config="$PWD/kexec/myconfig.nix" \
            -o result

      - name: Inspect result
        run: |
          find -L result -maxdepth 3 -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-kexec-aarch64
          path: result/
